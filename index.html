<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7f4ec">
<title>ペントミノ・パズル</title>
<link rel="apple-touch-icon" href="./assets/app-icon.PNG?v=2">
<link rel="icon" type="image/png" href="./assets/app-icon.PNG?v=2">
<link rel="manifest" href="./manifest.json">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  padding:28px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f3ee;
  color:#59616a;
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
main{
  width:min(100%,520px);
  padding:30px 24px 28px;
  text-align:center;
  border:1px solid #e2ded5;
  border-radius:24px;
  background:linear-gradient(145deg,#fffefa,#f0ede5);
  box-shadow:0 5px 18px rgba(84,75,56,.09),inset 0 1px 1px rgba(255,255,255,.8);
}
.logo{display:block;width:min(78%,300px);height:auto;margin:0 auto 18px}
.intro{margin:0 0 26px;color:#858780;font-size:14px;line-height:1.8}
.modes{display:grid;gap:14px}
.mode-link{
  display:block;
  padding:17px 18px;
  border:1px solid #e0ddd5;
  border-radius:17px;
  background:linear-gradient(145deg,#fffefa,#eeeae1);
  color:#626b70;
  text-decoration:none;
  box-shadow:0 3px 7px rgba(84,75,56,.08),inset 0 1px 1px rgba(255,255,255,.8);
  transition:transform .12s,box-shadow .12s;
}
.mode-link:active{transform:translateY(1px);box-shadow:0 1px 3px rgba(84,75,56,.1)}
.mode-title{display:block;font-size:19px;font-weight:750;letter-spacing:.04em}
.mode-description{display:block;margin-top:4px;color:#858780;font-size:12px}
.footer{margin:24px 0 0;color:#a09d94;font-size:11px}
@media(max-width:420px){
  body{padding:18px 12px}
  main{padding:26px 18px 22px}
  .logo{width:84%}
}
</style>
</head>
<body>
<main>
  <img src="./assets/logo.PNG" alt="Pentomino" class="logo">
  <p class="intro">12個のピースを組み合わせて、<br>10×6の盤面を完成させよう。</p>
  <nav class="modes" aria-label="ゲームモード">
    <a class="mode-link" href="./game.html?mode=beginner">
      <span class="mode-title">初級</span>
      <span class="mode-description">残り解答数を見ながら挑戦</span>
    </a>
    <a class="mode-link" href="./game.html?mode=advanced">
      <span class="mode-title">上級</span>
      <span class="mode-description">カウンターなしで挑戦</span>
    </a>
  </nav>
  <p class="footer">PENTOMINO PUZZLE</p>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration =
        await navigator.serviceWorker.register('./service-worker.js');

      console.log('Service Worker登録成功');

      let dismissedWorker = null;
      let applyingUpdate = false;

      // 更新通知を表示
      function showUpdateNotice(worker) {
        if (!worker || dismissedWorker === worker) return;
        if (document.getElementById('update-notice')) return;

        const notice = document.createElement('div');
        notice.id = 'update-notice';

        notice.style.cssText = `
          position:fixed;
          left:12px;
          right:12px;
          bottom:16px;
          z-index:999998;
          padding:14px 16px;
          border-radius:16px;
          background:#fffefa;
          border:1px solid #e2ded5;
          box-shadow:0 4px 18px #554b3830;
          color:#59616a;
          font-size:13px;
          line-height:1.6;
        `;

        const message = document.createElement('div');
        message.textContent = '新しいバージョンがあります。更新しますか？';

        const buttons = document.createElement('div');
        buttons.style.cssText = `
          display:flex;
          justify-content:flex-end;
          gap:8px;
          margin-top:10px;
        `;

        const laterButton = document.createElement('button');
        laterButton.textContent = 'あとで';

        const updateButton = document.createElement('button');
        updateButton.textContent = '更新する';

        laterButton.addEventListener('click', () => {
          dismissedWorker = worker;
          notice.remove();
        });

        updateButton.addEventListener('click', () => {
          const waitingWorker = registration.waiting || worker;

          if (!waitingWorker) return;

          // 現在のゲームデータを保存
          if (window.savePentominoBeforeUpdate) {
            window.savePentominoBeforeUpdate();
          }

          applyingUpdate = true;

          message.textContent = '更新しています…';
          laterButton.disabled = true;
          updateButton.disabled = true;

          // 新しいService Workerに切り替えを指示
          waitingWorker.postMessage({
            type: 'SKIP_WAITING'
          });
        });

        buttons.appendChild(laterButton);
        buttons.appendChild(updateButton);

        notice.appendChild(message);
        notice.appendChild(buttons);

        document.body.appendChild(notice);
      }

      // 待機中の更新があるか確認
      function checkWaiting() {
        if (
          registration.waiting &&
          navigator.serviceWorker.controller
        ) {
          showUpdateNotice(registration.waiting);
        }
      }

      // インストール中のWorkerを監視
      function checkInstalling() {
        const worker = registration.installing;
        if (!worker) return;

        function checkState() {
          if (
            worker.state === 'installed' &&
            navigator.serviceWorker.controller
          ) {
            checkWaiting();

            if (!registration.waiting) {
              showUpdateNotice(worker);
            }
          }
        }

        worker.addEventListener('statechange', checkState);
        checkState();
      }

      // 更新が見つかったとき
      registration.addEventListener('updatefound', checkInstalling);

      // 更新が適用され、制御Workerが切り替わったとき
      navigator.serviceWorker.addEventListener(
        'controllerchange',
        () => {
          if (applyingUpdate) {
            window.location.reload();
          }
        }
      );

      // 起動時に更新を確認
      checkWaiting();
      checkInstalling();
      await registration.update();
      checkInstalling();
      checkWaiting();

      // アプリに戻ってきたときに更新を確認
      async function checkForUpdate() {
        if (document.visibilityState !== 'visible') return;

        try {
          await registration.update();
          checkInstalling();
          checkWaiting();
        } catch (error) {
          console.log('更新確認をスキップしました', error);
        }
      }

      document.addEventListener('visibilitychange', checkForUpdate);
      window.addEventListener('pageshow', checkForUpdate);

    } catch (error) {
      console.error('Service Worker処理エラー', error);
    }
  });
}
</script>
</body>
</html>
