
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペントミノ・クリア演出</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:#282d38;color:white;
  font-family:system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.scene{width:100%;max-width:850px;padding:20px;text-align:center}
canvas{display:block;width:100%;height:auto}
.message{font-size:14px;color:#c4c9d0;margin:12px 0}
button{
  margin:8px 5px;padding:12px 24px;
  border:1px solid #ffffff55;border-radius:30px;
  background:#ffffff18;color:white;font-size:15px;
}
</style>
</head>
<body>
<div class="scene">
  <canvas id="effect"></canvas>
  <div class="message" id="message"></div>
  <button id="replay">もう一度再生</button>
  <button id="back">本編に戻る</button>
</div>

<script>
const canvas=document.getElementById("effect");
const ctx=canvas.getContext("2d");
const COLS=10,ROWS=6;

let width=800,height=480;
let startTime=0,animationId=null;
let pieces=[];

const data=localStorage.getItem("pentominoClearData");

if(data){
  try{
    pieces=JSON.parse(data).pieces;
  }catch(e){
    pieces=[];
  }
}

const message=document.getElementById("message");

if(!pieces.length){
  message.textContent="本編で12ピースを完成させると、ここに実際の盤面が表示されます。";
}else{
  message.textContent="完成盤面を再生中";
}

function clamp(v){return Math.max(0,Math.min(1,v));}
function ease(v){
  v=clamp(v);
  return v*v*(3-2*v);
}
function mix(a,b,t){
  return a+(b-a)*t;
}
function hexToRgb(hex){
  const n=parseInt(hex.replace("#",""),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function colorMix(a,b,t){
  const A=hexToRgb(a),B=hexToRgb(b);
  return "rgb("+A.map((v,i)=>Math.round(mix(v,B[i],t))).join(",")+")";
}
function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
}
function resize(){
  width=Math.min(window.innerWidth-32,800);
  height=Math.min(window.innerHeight-120,520);
  height=Math.max(height,300);

  const dpr=window.devicePixelRatio||1;
  canvas.width=width*dpr;
  canvas.height=height*dpr;
  canvas.style.width=width+"px";
  canvas.style.height=height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  play();
}

function getCells(){
  const result=[];
  for(const p of pieces){
    for(const [x,y] of p.cells){
      result.push({
        x,y,
        color:p.color,
        pieceId:p.id
      });
    }
  }
  return result;
}

function drawBoard(x,y,cell,t,seamFade){
  const cells=getCells();
  const colorProgress=ease((t-1.1)/1.0);
  const finalColor="#a5c6c0";

  // 最初は実際のピースの色で描画
  // 時間とともに全体がひとつの色へまとまる
  for(const c of cells){
    const px=x+c.x*cell;
    const py=y+c.y*cell;
    const gap=cell*0.045;
    const r=cell*0.25;

    const fill=colorMix(c.color,finalColor,colorProgress);

    ctx.save();
    ctx.shadowColor="rgba(0,0,0,0.18)";
    ctx.shadowBlur=cell*0.13;
    ctx.shadowOffsetX=cell*0.05;
    ctx.shadowOffsetY=cell*0.06;

    roundedRect(
      px+gap,py+gap,
      cell-gap*2,cell-gap*2,r
    );
    ctx.fillStyle=fill;
    ctx.fill();
    ctx.restore();
  }

  // ピース同士の境界線を描き、徐々に消す
  if(seamFade>0){
    const owner=Array.from({length:ROWS},()=>Array(COLS).fill(-1));

    for(const c of cells){
      if(c.x>=0&&c.x<COLS&&c.y>=0&&c.y<ROWS){
        owner[c.y][c.x]=c.pieceId;
      }
    }

    ctx.save();
    ctx.globalAlpha=seamFade*0.45;
    ctx.strokeStyle="#59616a";
    ctx.lineWidth=Math.max(1,cell*0.035);

    for(let yy=0;yy<ROWS;yy++){
      for(let xx=0;xx<COLS;xx++){
        if(owner[yy][xx]<0)continue;

        if(xx<COLS-1&&owner[yy][xx]!==owner[yy][xx+1]){
          ctx.beginPath();
          ctx.moveTo(x+(xx+1)*cell,y+yy*cell);
          ctx.lineTo(x+(xx+1)*cell,y+(yy+1)*cell);
          ctx.stroke();
        }

        if(yy<ROWS-1&&owner[yy][xx]!==owner[yy+1][xx]){
          ctx.beginPath();
          ctx.moveTo(x+xx*cell,y+(yy+1)*cell);
          ctx.lineTo(x+(xx+1)*cell,y+(yy+1)*cell);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  // 境界が消えた後の、ひとつにつながったクッション
  if(t>1.8){
    const alpha=ease((t-1.8)/0.5);
    ctx.save();
    ctx.globalAlpha=alpha;

    const path=new Path2D();
    for(let yy=0;yy<ROWS;yy++){
      for(let xx=0;xx<COLS;xx++){
        path.rect(x+xx*cell,y+yy*cell,cell,cell);
      }
    }

    ctx.shadowColor="rgba(165,198,192,0.45)";
    ctx.shadowBlur=cell*0.3;
    ctx.fillStyle="#a5c6c0";
    ctx.fill(path);

    const gradient=ctx.createLinearGradient(
      x,y,x+COLS*cell,y+ROWS*cell
    );
    gradient.addColorStop(0,"#c9ded8");
    gradient.addColorStop(0.5,"#a5c6c0");
    gradient.addColorStop(1,"#789d99");

    ctx.shadowBlur=0;
    ctx.fillStyle=gradient;
    ctx.fill(path);

    // 外周だけを描く
    ctx.strokeStyle="rgba(255,255,255,0.45)";
    ctx.lineWidth=cell*0.035;
    ctx.stroke(path);

    ctx.restore();
  }
}

function play(){
  if(animationId)cancelAnimationFrame(animationId);
  startTime=performance.now();
  animationId=requestAnimationFrame(animate);
}

function animate(now){
  const t=(now-startTime)/1000;
  ctx.clearRect(0,0,width,height);

  const appear=ease((t-0.2)/0.7);
  const seamFade=1-ease((t-1.3)/0.7);
  const glow=ease((t-1.8)/0.7);
  const textAlpha=ease((t-2.5)/0.6);

  const baseW=width*0.82;
  const cell=baseW/COLS;
  const baseH=cell*ROWS;

  let bounce=1;
  if(t>2.0&&t<2.9){
    const bt=(t-2.0)/0.9;
    bounce=1+Math.sin(bt*Math.PI)*0.09*(1-bt);
  }

  const scale=(0.65+appear*0.35)*bounce;
  const w=baseW*scale;
  const h=baseH*scale;
  const size=cell*scale;
  const x=(width-w)/2;
  const y=height*0.37-h/2;

  if(pieces.length){
    ctx.save();
    ctx.globalAlpha=appear;
    drawBoard(x,y,size,t,seamFade);
    ctx.restore();
  }

  if(glow>0){
    ctx.save();
    ctx.globalAlpha=glow*0.65;
    const radius=baseW*0.75;
    const g=ctx.createRadialGradient(
      width/2,height*0.4,10,
      width/2,height*0.4,radius
    );
    g.addColorStop(0,"rgba(165,198,192,0.22)");
    g.addColorStop(1,"rgba(165,198,192,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,width,height);
    ctx.restore();
  }

  if(textAlpha>0){
    ctx.save();
    ctx.globalAlpha=textAlpha;
    ctx.fillStyle="#f5f5ee";
    ctx.textAlign="center";
    ctx.font="700 "+Math.max(28,width*0.075)+"px system-ui";
    ctx.shadowColor="rgba(165,198,192,0.8)";
    ctx.shadowBlur=22;
    ctx.fillText("CLEAR!",width/2,y+h+55);
    ctx.restore();
  }

  if(t<4.5){
    animationId=requestAnimationFrame(animate);
  }else{
    animationId=null;
  }
}

document.getElementById("replay").addEventListener("click",play);
document.getElementById("back").addEventListener("click",()=>{
  location.href="index.html";
});
window.addEventListener("resize",resize);
resize();
</script>
</body>
</html>
