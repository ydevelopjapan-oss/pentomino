
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ペントミノ・クリア演出実験</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #282d38;
  color: white;
  font-family: system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.scene {
  width: 100%;
  max-width: 850px;
  padding: 20px;
  text-align: center;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
}

button {
  margin-top: 18px;
  padding: 12px 28px;
  border: 1px solid #ffffff55;
  border-radius: 30px;
  background: #ffffff18;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}
</style>
</head>

<body>

<div class="scene">
  <canvas id="effect"></canvas>
  <button id="replay">もう一度再生</button>
</div>

<script>
const canvas = document.getElementById("effect");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 6;

let width = 800;
let height = 480;
let startTime = 0;
let animationId = null;

const color = "#a5c6c0";

// 角を丸くした長方形
function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// 0～1の範囲に収める
function clamp(v) {
  return Math.max(0, Math.min(1, v));
}

// なめらかな変化
function ease(v) {
  v = clamp(v);
  return v * v * (3 - 2 * v);
}

// 画面サイズ調整
function resize() {
  const dpr = window.devicePixelRatio || 1;

  width = Math.min(window.innerWidth - 40, 800);
  height = width * 0.6;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  play();
}

// アニメーション開始
function play() {
  if (animationId) {
    cancelAnimationFrame(animationId);
  }

  startTime = performance.now();
  animate(startTime);
}

function animate(now) {
  const t = (now - startTime) / 1000;

  ctx.clearRect(0, 0, width, height);

  // 背景
  ctx.fillStyle = "#282d38";
  ctx.fillRect(0, 0, width, height);

  // アニメーションの進行度
  const appear = ease((t - 0.3) / 0.7);
  const seamFade = 1 - ease((t - 1.0) / 0.8);
  const glow = ease((t - 1.5) / 0.7);
  const clearText = ease((t - 2.5) / 0.6);

  // 完成形の大きさ
  const baseW = width * 0.78;
  const baseH = baseW * ROWS / COLS;

  // 膨らみ・弾み
  let bounce = 1;

  if (t > 1.8 && t < 2.8) {
    const p = (t - 1.8) / 1.0;
    bounce = 1 + Math.sin(p * Math.PI * 2) *
      Math.pow(1 - p, 2) * 0.09;
  }

  const scale = (0.65 + appear * 0.35) * bounce;

  const w = baseW * scale;
  const h = baseH * scale;

  const x = (width - w) / 2;
  const y = height * 0.40 - h / 2;

  ctx.save();

  // 全体の影
  ctx.shadowColor = "rgba(0,0,0,0.35)";
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 16;

  // クッション本体
  const gradient = ctx.createLinearGradient(
    x, y, x + w, y + h
  );

  gradient.addColorStop(0, "#d5e8df");
  gradient.addColorStop(0.48, color);
  gradient.addColorStop(1, "#719d98");

  roundedRect(x, y, w, h, 25);
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  // 内部の境界線
  // 時間とともに完全に消える
  if (seamFade > 0.01) {
    ctx.save();

    ctx.globalAlpha = seamFade * 0.65;
    ctx.strokeStyle = "#668d88";
    ctx.lineWidth = 1.5;

    for (let i = 1; i < COLS; i++) {
      const px = x + w * i / COLS;
      ctx.beginPath();
      ctx.moveTo(px, y + 4);
      ctx.lineTo(px, y + h - 4);
      ctx.stroke();
    }

    for (let i = 1; i < ROWS; i++) {
      const py = y + h * i / ROWS;
      ctx.beginPath();
      ctx.moveTo(x + 4, py);
      ctx.lineTo(x + w - 4, py);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 左上の光沢
  ctx.save();

  ctx.globalAlpha = appear * 0.65;

  const highlight = ctx.createLinearGradient(
    x, y, x + w * 0.6, y + h * 0.6
  );

  highlight.addColorStop(0, "rgba(255,255,255,0.55)");
  highlight.addColorStop(1, "rgba(255,255,255,0)");

  roundedRect(x + 5, y + 5, w - 10, h - 10, 22);
  ctx.strokeStyle = highlight;
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.restore();

  // 外周を走る光
  if (glow > 0) {
    ctx.save();

    ctx.globalAlpha = glow * (1 - ease((t - 3.0) / 0.7));
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 25;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;

    roundedRect(x - 2, y - 2, w + 4, h + 4, 27);
    ctx.stroke();

    ctx.restore();
  }

  // CLEAR!
  if (clearText > 0) {
    ctx.save();

    ctx.globalAlpha = clearText;
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 18;
    ctx.font = "bold 38px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      "CLEAR!",
      width / 2,
      y + h + 55
    );

    ctx.restore();
  }

  if (t < 4.5) {
    animationId = requestAnimationFrame(animate);
  } else {
    animationId = null;
  }
}

document.getElementById("replay").addEventListener("click", play);

window.addEventListener("resize", resize);

resize();
</script>

</body>
</html>
